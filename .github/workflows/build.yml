name: Build Android App
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter 설정
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'   # ← 버전 고정 (중요!)
          channel: 'stable'

      - name: Flet + 패키지 설치
        run: pip install flet==0.24.1 pandas openpyxl   # ← 버전 고정 (중요!)

      - name: APK 빌드
        run: flet build apk --module-name mobile_app

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Hub-App
          path: build/apk/release/*.apk
